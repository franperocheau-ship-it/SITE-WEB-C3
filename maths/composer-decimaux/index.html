<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Composer un nombre décimal — Mathématiques — LFM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-client.js" onerror="void 0"></script>
  <script src="../../js/auth.js" onerror="void 0"></script>
  <script src="../../js/results.js" onerror="void 0"></script>
  <style>
    /* ── Tokens ── */
    :root {
      --navy:    #1A2D6B;
      --gold:    #F5A623;
      --gold-bg: #FFF3D0;
      --teal:    #1DBFA0;
      --err:     #E05252;
      --purple:  #7C3AED;
      --bg:      #F8FAFC;
      --white:   #ffffff;
      --border:  #E8EDF3;
      --text:    #1E2532;
      --muted:   #5F6368;
      --green:   #16a34a;
      --green-bg:#dcfce7;
      --shadow:  0 10px 30px rgba(26,45,107,0.10);
      --radius:  20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-top: 50px;
    }

    /* ── Navbar Proficiamus ── */
    .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;border-bottom:1px solid #e8e8e8;height:auto;padding:4px 0;display:flex;align-items:center;}
    .navbar__inner{max-width:1100px;margin:0 auto;padding:0 20px;width:100%;display:flex;align-items:center;justify-content:space-between;}
    .navbar__brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
    .navbar__brand img{height:34px;width:auto;}
    .navbar__nav{display:flex;align-items:center;gap:24px;}
    .navbar__nav a{text-decoration:none;color:#1a1a1a;font-family:'Fredoka',sans-serif;font-size:14px;font-weight:700;transition:color .2s;}
    .navbar__nav a:hover{color:#1B4EBF;}
    .nav-lang{font-size:14px;font-weight:700;cursor:pointer;color:#1a1a1a;font-family:'Fredoka',sans-serif;}
    .navbar__nav .btn-login{color:#fff!important;}
    .btn-login{background:#102B6A;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;transition:background .2s;}
    .btn-login:hover{background:#0b1e4d;}
    @media(max-width:768px){.navbar__brand img{height:28px;}.navbar__nav{gap:12px;}.navbar__nav a:not(.btn-login){display:none;}.nav-lang{display:none;}.btn-login{padding:7px 13px;font-size:13px;}}

    /* ── Main layout ── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── Page title ── */
    .page-title { text-align: center; margin-bottom: 28px; }
    .page-title h1 { font-size: 26px; font-weight: 700; color: var(--navy); line-height: 1.25; }
    .page-title .subtitle { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .page-rule { width: 44px; height: 3px; background: var(--gold); border-radius: 2px; margin: 10px auto 0; }

    /* ── Level tabs ── */
    .level-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .level-tab {
      border: 2px solid var(--border);
      border-radius: 100px;
      padding: 9px 22px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 700;
      background: var(--white);
      color: var(--muted);
      cursor: pointer;
      transition: all 200ms;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .level-tab.active   { background: var(--navy); border-color: var(--navy); color: #fff; }
    .level-tab.unlocked:hover:not(.active) { border-color: var(--navy); color: var(--navy); }
    .level-tab.locked   { opacity: 0.55; cursor: not-allowed; }

    /* ── Tableau de numération ── */
    .num-table-wrapper {
      overflow-x: auto;
      margin-bottom: 0;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .num-table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
    }
    .num-table thead th {
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }
    .num-table thead th.col-entier { background: rgba(26,45,107,0.85); color: #fff; }
    .num-table thead th.col-dec    { background: rgba(26,45,107,0.70); color: #fff; }
    .num-table thead th.col-sep {
      background: var(--navy);
      color: var(--gold);
      font-size: 20px;
      padding: 0 4px;
      width: 22px;
    }
    .num-table tbody td {
      padding: 10px 6px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      border-top: 2px solid var(--border);
      min-width: 68px;
      vertical-align: middle;
      transition: background 280ms, color 280ms;
    }
    .num-table tbody td.col-entier { background: rgba(26,45,107,0.06); color: var(--navy); }
    .num-table tbody td.col-dec    { background: var(--gold-bg); color: #92400e; }
    .num-table tbody td.col-sep {
      background: var(--white);
      font-size: 28px;
      font-weight: 900;
      color: var(--navy);
      border-left: 3px solid var(--navy);
      border-right: 3px solid var(--navy);
      min-width: 22px;
      padding: 0 2px;
    }

    /* États des cellules en mode affichage */
    .num-table tbody td.cell-empty    { color: var(--border); font-size: 16px; font-weight: 500; }
    .num-table tbody td.cell-inactive { color: var(--border); font-size: 18px; }
    .num-table tbody td.cell-show     { animation: popIn 350ms ease forwards; }

    /* Cellule contenant un input */
    .num-table tbody td.cell-active { padding: 8px 5px; }

    /* ── Input à l'intérieur des cellules ── */
    .cell-inp {
      width: 52px;
      height: 52px;
      border: 2.5px solid var(--border);
      border-radius: 10px;
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
      background: var(--white);
      outline: none;
      caret-color: var(--navy);
      transition: border-color 180ms, box-shadow 180ms, background 180ms;
    }
    .cell-inp:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(26,45,107,0.14);
    }
    .cell-inp.inp-ok  { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .cell-inp.inp-err { border-color: var(--err); color: var(--err); background: #fef2f2; animation: shake 300ms ease; }

    @keyframes popIn {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-4px); }
      75%     { transform: translateX(4px); }
    }

    /* ── Aperçu du nombre composé ── */
    .live-preview {
      text-align: center;
      margin: 10px 0 18px;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .pnum {
      color: var(--navy);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    .pnum.complete { color: var(--teal); }

    /* ── Progress ── */
    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-label { font-size: 13px; font-weight: 700; color: var(--navy); }
    .progress-score { font-size: 13px; font-weight: 600; color: var(--muted); }
    .progress-bar-bg { height: 7px; background: var(--border); border-radius: 100px; overflow: hidden; margin-bottom: 20px; }
    .progress-bar-fill { height: 100%; background: var(--teal); border-radius: 100px; transition: width 400ms ease; }

    /* ── Carte de question ── */
    .q-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px 36px;
      transition: opacity 200ms;
    }
    .q-card.animate { animation: fadeUp 320ms ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .q-type-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 14px;
    }

    /* ── Affichage de la décomposition ── */
    .decomp-display {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.7;
      margin-bottom: 22px;
      padding: 18px 22px;
      background: var(--bg);
      border-radius: 14px;
      border: 1.5px solid var(--border);
      text-align: center;
    }
    .decomp-op    { color: var(--muted); font-size: 20px; font-weight: 500; }
    .decomp-arrow { color: var(--muted); font-size: 18px; }

    /* Fractions */
    .frac-d { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; vertical-align: middle; gap: 2px; }
    .frac-d .fn { font-size: 20px; font-weight: 700; }
    .frac-d .fb { width: 100%; border: none; border-top: 2.5px solid currentColor; min-width: 22px; margin: 1px 0; }
    .frac-d .fd { font-size: 13px; font-weight: 600; color: var(--muted); }

    /* Couleurs par position */
    .tc-u { color: var(--navy); }
    .tc-d { color: #b45309; }
    .tc-c { color: #0d9488; }
    .tc-m { color: var(--purple); }

    /* ── QCM (Forme E) ── */
    .choices-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 20px; }
    .choice-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
      transition: border-color 200ms, background 200ms, transform 200ms;
    }
    .choice-btn:hover:not(:disabled):not(.ok):not(.err) { border-color: var(--navy); background: rgba(26,45,107,0.04); transform: translateY(-2px); }
    .choice-btn:disabled { cursor: default; }
    .choice-btn.ok  { border-color: var(--green); background: var(--green-bg); color: #15803d; }
    .choice-btn.err { border-color: var(--err);   background: #fef2f2;         color: var(--err); }

    /* ── Bouton Valider ── */
    .validate-btn {
      width: 100%;
      padding: 15px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background 200ms, transform 200ms, opacity 200ms;
    }
    .validate-btn:hover:not(:disabled) { background: #142358; transform: translateY(-2px); }
    .validate-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Feedback ── */
    .feedback { margin-top: 16px; padding: 14px 18px; border-radius: 14px; font-size: 15px; font-weight: 600; line-height: 1.55; display: none; }
    .feedback.visible  { display: block; animation: fadeUp 250ms ease; }
    .feedback.ok-fb    { background: var(--green-bg); color: #15803d; border: 1.5px solid #86efac; }
    .feedback.err-fb   { background: #fef2f2; color: #b91c1c; border: 1.5px solid #fca5a5; }
    .feedback.hint-fb  { background: #fffbeb; color: #92400e; border: 1.5px solid #fde68a; }

    /* ── Correction pas à pas ── */
    .correction-block { margin-top: 12px; padding: 14px 18px; background: rgba(26,45,107,0.04); border-radius: 12px; border: 1.5px solid var(--border); font-size: 14px; color: var(--navy); line-height: 1.8; display: none; }
    .correction-block.visible { display: block; animation: fadeUp 300ms ease; }
    .corr-step { display: flex; align-items: center; gap: 8px; }
    .corr-arrow { color: var(--teal); font-weight: 700; }
    .corr-result { margin-top: 8px; font-size: 15px; font-weight: 700; color: var(--navy); }

    /* ── Bouton Suivant ── */
    .next-btn { width: 100%; margin-top: 12px; padding: 14px; background: var(--teal); color: #fff; border: none; border-radius: 14px; font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; display: none; transition: background 200ms, transform 200ms; }
    .next-btn.visible { display: block; animation: fadeUp 250ms ease; }
    .next-btn:hover   { background: #17a88d; transform: translateY(-2px); }

    /* ── Écran de résultat ── */
    .result-screen { display: none; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 48px 36px; text-align: center; }
    .result-screen.visible { display: block; animation: fadeUp 350ms ease; }
    .result-emoji { font-size: 56px; margin-bottom: 12px; }
    .result-title { font-size: 26px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
    .result-score { font-size: 48px; font-weight: 700; color: var(--gold); margin: 12px 0; }
    .result-msg   { font-size: 16px; color: var(--muted); margin-bottom: 28px; line-height: 1.5; }
    .result-btns  { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary  { padding: 13px 32px; background: var(--navy); color: #fff; border: none; border-radius: 100px; font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 200ms, transform 200ms; }
    .btn-primary:hover { background: #142358; transform: translateY(-2px); }
    .btn-secondary { padding: 13px 32px; background: transparent; color: var(--navy); border: 2px solid var(--border); border-radius: 100px; font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 200ms; }
    .btn-secondary:hover { border-color: var(--navy); transform: translateY(-2px); }

    /* ── Confettis ── */
    .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 999; }
    .confetti-piece { position: absolute; top: -12px; border-radius: 2px; animation: confettiFall linear forwards; }
    @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

    /* ── Mobile ── */
    @media (max-width: 540px) {
      .main { padding: 20px 12px 48px; }
      .q-card { padding: 22px 18px; }
      .decomp-display { font-size: 18px; padding: 14px 12px; gap: 4px; }
      .choices-grid { grid-template-columns: 1fr; }
      .cell-inp { width: 44px; height: 44px; font-size: 22px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar__inner">
    <a href="../../index-v2.html" class="navbar__brand">
      <img src="../../assets/proficiamuspetit.png?v=9" alt="Logo Proficiamus" />
    </a>
    <div class="navbar__nav">
      <a href="../../index-v2.html">Accueil</a>
      <a href="../../apropos.html">À propos</a>
      <span class="nav-lang">🌐 FR ∨</span>
      <button class="btn-login menu-btn" aria-label="Ouvrir le menu">👤 Connexion</button>
    </div>
  </div>
</nav>

<main class="main">

  <div class="page-title">
    <h1>Composer un nombre décimal</h1>
    <p class="subtitle">Cycle 3 — Nombres et calculs — Nombres décimaux</p>
    <div class="page-rule"></div>
  </div>

  <!-- Onglets de niveau -->
  <div class="level-tabs" id="levelTabs">
    <button class="level-tab active unlocked" data-level="1" onclick="selectLevel(1)">Niveau 1</button>
    <button class="level-tab locked"          data-level="2" onclick="selectLevel(2)">
      <span class="lock-icon" id="lock2">🔒</span> Niveau 2
    </button>
    <button class="level-tab locked"          data-level="3" onclick="selectLevel(3)">
      <span class="lock-icon" id="lock3">🔒</span> Niveau 3
    </button>
  </div>

  <!-- Tableau de numération — les cases actives deviennent des champs de saisie -->
  <div class="num-table-wrapper">
    <table class="num-table" id="numTable">
      <thead>
        <tr>
          <th class="col-entier">Centaines</th>
          <th class="col-entier">Dizaines</th>
          <th class="col-entier">Unités</th>
          <th class="col-sep">║</th>
          <th class="col-dec">Dixièmes</th>
          <th class="col-dec">Centièmes</th>
          <th class="col-dec">Millièmes</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-entier cell-empty" id="td-ce">?</td>
          <td class="col-entier cell-empty" id="td-di">?</td>
          <td class="col-entier cell-empty" id="td-u">?</td>
          <td class="col-sep">,</td>
          <td class="col-dec cell-empty"    id="td-d">?</td>
          <td class="col-dec cell-empty"    id="td-c">?</td>
          <td class="col-dec cell-empty"    id="td-m">?</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Aperçu en temps réel du nombre composé -->
  <div class="live-preview" id="livePreview"></div>

  <!-- Progression -->
  <div id="progressArea">
    <div class="progress-row">
      <span class="progress-label" id="progressLabel">Question 1/5</span>
      <span class="progress-score" id="progressScore">Score : 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Carte de question -->
  <div class="q-card animate" id="qCard">
    <div class="q-type-badge"     id="qTypeBadge"></div>
    <div id="qBody"></div>
    <div class="feedback"         id="feedback"></div>
    <div class="correction-block" id="correctionBlock"></div>
    <button class="next-btn"      id="nextBtn" onclick="nextQuestion()">Question suivante →</button>
  </div>

  <!-- Écran de résultat -->
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-msg"   id="resultMsg"></div>
    <div class="result-btns">
      <button class="btn-primary"   id="nextLevelBtn" onclick="goNextLevel()" style="display:none">
        Niveau suivant 🔓
      </button>
      <button class="btn-secondary" onclick="retryLevel()">Réessayer</button>
      <a class="btn-secondary" href="../../mathématiques-nombres-decimaux.html"
         style="display:inline-flex;align-items:center;text-decoration:none">← Retour</a>
    </div>
  </div>

</main>

<div class="confetti-container" id="confettiContainer"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   BANQUES DE QUESTIONS
═══════════════════════════════════════════════════════════ */
const BANKS = {
  1: [
    { decomp: "2 + 3/10",  formes: ["A","B"],  reponse: "2,3"               },
    { decomp: "0 + 7/10",  formes: ["A","B"],  reponse: "0,7"               },
    { decomp: "5 + 4/10",  formes: ["A","C"],  reponse: "5,4"               },
    { decomp: "1 + 0/10",  formes: ["B","C"],  reponse: "1,0",  piege: true },
    { decomp: "4 + 9/10",  formes: ["A","B"],  reponse: "4,9"               },
    { decomp: "0 + 1/10",  formes: ["A","C"],  reponse: "0,1"               },
    { decomp: "3 + 6/10",  formes: ["B","C"],  reponse: "3,6"               },
    { decomp: "7 + 5/10",  formes: ["A","B"],  reponse: "7,5"               }
  ],
  2: [
    { decomp: "3 + 4/10 + 7/100",                    forme: "A", reponse: "3,47"  },
    { decomp: "1 + 0/10 + 4/100",                    forme: "B", reponse: "1,04",  piege: true },
    { decomp: "0 + 0/10 + 8/100",                    forme: "B", reponse: "0,08",  piege: true },
    { decomp: "4/10 + 7/100",                        forme: "C", reponse: "0,47"  },
    { decomp: "7 centièmes + 3 unités + 4 dixièmes", forme: "D", reponse: "3,47"  },
    { decomp: "6 + 3/10 + 0/100",                    forme: "B", reponse: "6,30",  piege: true },
    { decomp: "0 + 2/10 + 5/100",                    forme: "A", reponse: "0,25"  },
    { decomp: "12 + 5/10 + 0/100",                   forme: "B", reponse: "12,50", piege: true }
  ],
  3: [
    { decomp: "1 + 3/10 + 7/100 + 5/1000",  forme: "A", reponse: "1,375" },
    { decomp: "2 + 0/10 + 0/100 + 8/1000",  forme: "B", reponse: "2,008", piege: true },
    { decomp: "0 + 0/10 + 4/100 + 0/1000",  forme: "B", reponse: "0,040", piege: true },
    { decomp: "3 + 6/100",                  forme: "C", reponse: "3,060" },
    { decomp: "5/1000",                      forme: "C", reponse: "0,005", piege: true },
    { decomp: "2 + 47/1000",                 forme: "D", reponse: "2,047" },
    { decomp: "0 + 500/1000",                forme: "D", reponse: "0,500" },
    { nombre: "0,305", forme: "E",
      choix: ["3/10 + 0/100 + 5/1000","3/100 + 5/1000","0 + 3/10 + 5/1000","305/100"],
      reponse_index: 0 }
  ]
};

const CONFIG = {
  1: { perSession: 5, threshold: 4 },
  2: { perSession: 6, threshold: 5 },
  3: { perSession: 6, threshold: 5 }
};

/* ═══════════════════════════════════════════════════════════
   ÉTAT
═══════════════════════════════════════════════════════════ */
let currentLevel = 1;
let session      = [];
let sessionIdx   = 0;
let score        = 0;
let attempts     = 0;
let answered     = false;
let levelsDone   = JSON.parse(sessionStorage.getItem('cdLevelsDone') || '{}');

/* ═══════════════════════════════════════════════════════════
   UTILITAIRES
═══════════════════════════════════════════════════════════ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* "3,47" → { ce:'', di:'', u:'3', d:'4', c:'7', m:'' } */
function parseAnswer(rep) {
  const [intStr = '0', decStr = ''] = rep.split(',');
  const len = intStr.length;
  return {
    ce: len >= 3 ? intStr[len - 3] : '',
    di: len >= 2 ? intStr[len - 2] : '',
    u:  intStr[len - 1] ?? '',
    d:  decStr[0] ?? '',
    c:  decStr[1] ?? '',
    m:  decStr[2] ?? ''
  };
}

const COL_IDS = { ce:'td-ce', di:'td-di', u:'td-u', d:'td-d', c:'td-c', m:'td-m' };

/* Colonnes actives : du premier au dernier chiffre de la réponse */
function getActiveCols(q) {
  if (q._forme === 'E') return [];
  const p   = parseAnswer(q.reponse);
  const all = ['ce','di','u','d','c','m'];
  let first = -1, last = -1;
  all.forEach((k, i) => {
    if (p[k] !== '') { if (first === -1) first = i; last = i; }
  });
  return first === -1 ? ['u'] : all.slice(first, last + 1);
}

/* Remet toutes les cellules à "?" (supprime les inputs existants) */
function resetTable() {
  for (const id of Object.values(COL_IDS)) {
    const td = document.getElementById(id);
    td.innerHTML = '?';
    td.className = td.className
      .split(' ')
      .filter(c => !['cell-active','cell-empty','cell-inactive','cell-show'].includes(c))
      .join(' ');
    td.classList.add('cell-empty');
  }
}

/* Remplissage en mode affichage pur (Forme E) */
function fillTableDisplay(rep) {
  const p = parseAnswer(rep);
  for (const [key, id] of Object.entries(COL_IDS)) {
    const td = document.getElementById(id);
    ['cell-active','cell-empty','cell-inactive','cell-show'].forEach(s => td.classList.remove(s));
    if (p[key] !== '') {
      td.innerHTML = p[key];
      td.classList.add('cell-show');
    } else {
      td.innerHTML = ' ';
      td.classList.add('cell-inactive');
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   INPUTS DANS LE TABLEAU
═══════════════════════════════════════════════════════════ */
function setupTableInputs(activeCols) {
  /* Place les inputs dans les bonnes cellules, vide les autres */
  for (const [key, id] of Object.entries(COL_IDS)) {
    const td = document.getElementById(id);
    ['cell-active','cell-empty','cell-inactive','cell-show'].forEach(s => td.classList.remove(s));
    if (activeCols.includes(key)) {
      td.classList.add('cell-active');
      td.innerHTML = `<input class="cell-inp" id="inp-${key}" type="text"
                        inputmode="numeric" maxlength="1" autocomplete="off">`;
    } else {
      td.innerHTML = ' ';
      td.classList.add('cell-inactive');
    }
  }

  /* Câblage : saisie + auto-avance + retour-arrière */
  activeCols.forEach((col, i) => {
    const inp = document.getElementById(`inp-${col}`);
    if (!inp) return;

    inp.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 1);
      if (this.value) {
        const next = activeCols[i + 1];
        if (next) {
          const ni = document.getElementById(`inp-${next}`);
          if (ni && !ni.disabled) setTimeout(() => ni.focus(), 0);
        }
      }
      updateLivePreview();
      checkTableReady();
    });

    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && this.value === '') {
        const prev = activeCols[i - 1];
        if (prev) {
          const pi = document.getElementById(`inp-${prev}`);
          if (pi && !pi.disabled) setTimeout(() => pi.focus(), 0);
        }
      }
    });
  });

  setTimeout(() => document.getElementById(`inp-${activeCols[0]}`)?.focus(), 80);
}

/* Active Valider quand toutes les cases non verrouillées sont remplies */
function checkTableReady() {
  const q = session[sessionIdx];
  if (!q || q._forme === 'E') return;
  const allFilled = q._activeCols.every(col => {
    const inp = document.getElementById(`inp-${col}`);
    return !inp || inp.disabled || inp.value !== '';
  });
  const btn = document.getElementById('validateBtn');
  if (btn) btn.disabled = !allFilled;
}

/* Aperçu en temps réel */
function updateLivePreview() {
  const el = document.getElementById('livePreview');
  if (!el) return;
  const q = session[sessionIdx];
  if (!q || q._forme === 'E') { el.innerHTML = ''; return; }

  const activeCols = q._activeCols;
  const intCols = ['ce','di','u'].filter(c => activeCols.includes(c));
  const decCols = ['d','c','m'].filter(c => activeCols.includes(c));

  const val = col => {
    const inp = document.getElementById(`inp-${col}`);
    return inp ? (inp.value || '?') : '?';
  };

  const intStr  = intCols.map(val).join('') || '?';
  const decStr  = decCols.map(val).join('');
  const preview = decCols.length > 0 ? intStr + ',' + decStr : intStr;
  const done    = !preview.includes('?');

  el.innerHTML = `Tu composes →&nbsp;<span class="pnum${done ? ' complete' : ''}">${preview}</span>`;
}

/* ═══════════════════════════════════════════════════════════
   RENDU DES DÉCOMPOSITIONS
═══════════════════════════════════════════════════════════ */
const TC = { u:'tc-u', d:'tc-d', c:'tc-c', m:'tc-m' };

function termHtml(t) {
  t = t.trim();
  if (!t.includes('/')) return `<span class="${TC.u}">${t}</span>`;
  const [num, den] = t.split('/');
  const cls = den === '10' ? TC.d : den === '100' ? TC.c : TC.m;
  return `<span class="frac-d"><span class="fn ${cls}">${num.trim()}</span><hr class="fb"><span class="fd">${den.trim()}</span></span>`;
}

function renderFractional(decomp) {
  return decomp.split(' + ').map((t, i) =>
    (i ? '<span class="decomp-op"> + </span>' : '') + termHtml(t)
  ).join('');
}

function renderWordsL1(decomp, reversed) {
  const terms = decomp.split(' + ');
  let intV = '', dixV = '';
  for (const t of terms) {
    if (t.includes('/10')) dixV = t.split('/')[0].trim();
    else intV = t.trim();
  }
  const uL = parseInt(intV) <= 1 ? 'unité' : 'unités';
  const dL = parseInt(dixV) <= 1 ? 'dixième' : 'dixièmes';
  const uS = `<span class="${TC.u}">${intV}</span> ${uL}`;
  const dS = `<span class="${TC.d}">${dixV}</span> ${dL}`;
  const et = '<span class="decomp-op"> et </span>';
  return reversed ? dS + et + uS : uS + et + dS;
}

function renderWordsDisordered(decomp) {
  const toCol = {
    'unités':TC.u,'unité':TC.u,'dixièmes':TC.d,'dixième':TC.d,
    'centièmes':TC.c,'centième':TC.c,'millièmes':TC.m,'millième':TC.m
  };
  return decomp.split(' + ').map((t, i) => {
    t = t.trim();
    const sp = t.indexOf(' ');
    const html = `<span class="${toCol[t.slice(sp+1)] || TC.u}">${t.slice(0,sp)}</span> ${t.slice(sp+1)}`;
    return (i ? '<span class="decomp-op"> + </span>' : '') + html;
  }).join('');
}

function buildDecompHtml(q) {
  if (q.level === 1 && q._forme === 'B') return renderWordsL1(q.decomp, false);
  if (q.level === 1 && q._forme === 'C') return renderWordsL1(q.decomp, true);
  if (q.level === 2 && q._forme === 'D') return renderWordsDisordered(q.decomp);
  return renderFractional(q.decomp);
}

function colorChoiceText(text) {
  return text
    .replace(/(\d+)\/1000/g, `<span class="${TC.m}">$1</span><span style="color:var(--muted)">/1000</span>`)
    .replace(/(\d+)\/100/g,  `<span class="${TC.c}">$1</span><span style="color:var(--muted)">/100</span>`)
    .replace(/(\d+)\/10/g,   `<span class="${TC.d}">$1</span><span style="color:var(--muted)">/10</span>`);
}

/* ═══════════════════════════════════════════════════════════
   CONSTRUCTION DES SESSIONS
═══════════════════════════════════════════════════════════ */
function buildQuestions(level) {
  return shuffle(BANKS[level]).slice(0, CONFIG[level].perSession).map(entry => {
    const q     = { ...entry, level };
    q._forme    = Array.isArray(entry.formes)
      ? entry.formes[Math.floor(Math.random() * entry.formes.length)]
      : entry.forme;
    q._activeCols = getActiveCols(q);
    return q;
  });
}

/* ═══════════════════════════════════════════════════════════
   GESTION DES NIVEAUX
═══════════════════════════════════════════════════════════ */
function initLevelTabs() {
  for (const lv of [1,2,3]) {
    const btn  = document.querySelector(`.level-tab[data-level="${lv}"]`);
    const lock = document.getElementById(`lock${lv}`);
    if (lv === 1 || levelsDone[lv - 1]) {
      btn.classList.remove('locked'); btn.classList.add('unlocked');
      if (lock) lock.textContent = '🔓';
    }
  }
}

function selectLevel(lv) {
  if (lv > 1 && !levelsDone[lv - 1]) return;
  currentLevel = lv;
  document.querySelectorAll('.level-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.level-tab[data-level="${lv}"]`).classList.add('active');
  startLevel();
}

function startLevel() {
  session    = buildQuestions(currentLevel);
  sessionIdx = 0;
  score      = 0;
  document.getElementById('resultScreen').classList.remove('visible');
  document.getElementById('qCard').style.display        = '';
  document.getElementById('progressArea').style.display  = '';
  renderQuestion();
}

/* ═══════════════════════════════════════════════════════════
   RENDU D'UNE QUESTION
═══════════════════════════════════════════════════════════ */
function updateProgress() {
  const total = CONFIG[currentLevel].perSession;
  document.getElementById('progressLabel').textContent = `Question ${sessionIdx + 1}/${total}`;
  document.getElementById('progressScore').textContent = `Score : ${score}`;
  document.getElementById('progressFill').style.width  = `${(sessionIdx / total) * 100}%`;
}

function renderQuestion() {
  const q = session[sessionIdx];
  attempts = 0;
  answered = false;

  resetTable();
  updateProgress();
  updateLivePreview();

  const card = document.getElementById('qCard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
  card.classList.add('animate');

  ['feedback','correctionBlock'].forEach(id => {
    const el = document.getElementById(id);
    el.className = el.className.replace('visible','').trim();
    el.innerHTML = '';
  });
  document.getElementById('nextBtn').className = 'next-btn';

  if (q._forme === 'E') {
    document.getElementById('livePreview').innerHTML = '';
    renderQcmInverse(q);
    setTimeout(() => fillTableDisplay(q.nombre), 80);
  } else {
    renderTableQuestion(q);
  }
}

/* ─── Forme E — QCM inversé ─────────────────────────────── */
function renderQcmInverse(q) {
  document.getElementById('qTypeBadge').textContent = 'Trouve la bonne décomposition';

  const shuffled = shuffle(q.choix.map((c, i) => ({ text: c, origIdx: i })));
  q._shuffled = shuffled;

  document.getElementById('qBody').innerHTML = `
    <div class="decomp-display">
      <span class="${TC.u}" style="font-size:30px">${q.nombre}</span>
      <span class="decomp-arrow" style="margin-left:8px">= ?</span>
    </div>
    <div class="choices-grid" id="choicesGrid">
      ${shuffled.map((c, i) => `
        <button class="choice-btn" id="qcm-${i}" onclick="validateQcm(${i})">
          ${colorChoiceText(c.text)}
        </button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px">
      Une seule bonne réponse
    </div>
  `;
}

/* ─── Formes A/B/C/D — saisie dans le tableau ───────────── */
function renderTableQuestion(q) {
  const badges = {
    A: 'Place les chiffres dans le tableau',
    B: q.level === 1 ? 'Place les chiffres dans le tableau' : 'Attention aux zéros !',
    C: 'Place les chiffres dans le tableau',
    D: q.level === 2 ? 'Ordre mélangé — place dans le tableau' : 'Place les chiffres dans le tableau'
  };
  document.getElementById('qTypeBadge').textContent = badges[q._forme] || 'Place les chiffres dans le tableau';

  document.getElementById('qBody').innerHTML = `
    <div class="decomp-display">
      ${buildDecompHtml(q)}
      <span class="decomp-arrow"> →  ?</span>
    </div>
    <button class="validate-btn" id="validateBtn" onclick="validateTable()" disabled>
      Valider
    </button>
  `;

  setupTableInputs(q._activeCols);
}

/* ═══════════════════════════════════════════════════════════
   VALIDATION — TABLEAU
═══════════════════════════════════════════════════════════ */
function validateTable() {
  if (answered) return;
  const q        = session[sessionIdx];
  const expected = parseAnswer(q.reponse);
  const wrongCols = [];

  for (const col of q._activeCols) {
    const inp = document.getElementById(`inp-${col}`);
    if (!inp || inp.disabled) continue;
    inp.classList.remove('inp-ok', 'inp-err');
    if (inp.value === (expected[col] ?? '')) {
      inp.classList.add('inp-ok');
    } else {
      inp.classList.add('inp-err');
      wrongCols.push(col);
    }
  }

  if (wrongCols.length === 0) {
    q._activeCols.forEach(col => {
      const inp = document.getElementById(`inp-${col}`);
      if (inp) inp.disabled = true;
    });
    handleCorrect();
  } else {
    handleWrong(q, wrongCols);
  }
}

/* ═══════════════════════════════════════════════════════════
   VALIDATION — QCM (Forme E)
═══════════════════════════════════════════════════════════ */
function validateQcm(i) {
  if (answered) return;
  const q   = session[sessionIdx];
  const ok  = q._shuffled[i].origIdx === q.reponse_index;

  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  document.getElementById(`qcm-${i}`).classList.add(ok ? 'ok' : 'err');

  if (!ok) {
    q._shuffled.forEach((c, idx) => {
      if (c.origIdx === q.reponse_index)
        document.getElementById(`qcm-${idx}`).classList.add('ok');
    });
    answered = true;
    showFeedback('err', '✗ Pas cette fois. La bonne réponse est en vert.');
    showCorrection(q);
    showNextBtn();
  } else {
    handleCorrect();
  }
}

/* ═══════════════════════════════════════════════════════════
   CORRECT / FAUX
═══════════════════════════════════════════════════════════ */
function handleCorrect() {
  answered = true;
  score++;
  document.getElementById('progressScore').textContent = `Score : ${score}`;
  updateLivePreview();
  showFeedback('ok', '✓ Excellent ! C\'est bien ça.');
  showNextBtn();
}

function handleWrong(q, wrongCols) {
  attempts++;

  const NAMES = { ce:'centaines', di:'dizaines', u:'unités', d:'dixièmes', c:'centièmes', m:'millièmes' };

  if (attempts === 1) {
    const names = wrongCols.map(c => `<strong>${NAMES[c]}</strong>`).join(', ');
    const msg   = wrongCols.length === 1 ? `Vérifie la case ${names}.` : `Vérifie les cases : ${names}.`;
    showFeedback('hint', '⚠ Pas tout à fait… ' + msg);

    /* Verrouille les cases correctes, vide les fausses pour réessai */
    q._activeCols.forEach(col => {
      const inp = document.getElementById(`inp-${col}`);
      if (!inp) return;
      if (inp.classList.contains('inp-ok')) {
        inp.disabled = true;
      } else {
        inp.value = '';
        inp.classList.remove('inp-err');
      }
    });
    q._wrongCols1 = wrongCols;
    document.getElementById('validateBtn').disabled = true;
    updateLivePreview();
    setTimeout(() => document.getElementById(`inp-${wrongCols[0]}`)?.focus(), 60);

  } else {
    /* 2e erreur : remplit les cases fausses avec la bonne valeur (en rouge) */
    answered = true;
    const expected = parseAnswer(q.reponse);
    (q._wrongCols1 || q._activeCols).forEach(col => {
      const inp = document.getElementById(`inp-${col}`);
      if (inp && !inp.disabled) {
        inp.value = expected[col] || '';
        inp.disabled = true;
        inp.classList.remove('inp-ok', 'inp-err');
        inp.classList.add('inp-err');
      }
    });
    updateLivePreview();
    showFeedback('err', '✗ Pas cette fois. Voici la correction :');
    showCorrection(q);
    showNextBtn();
  }
}

/* ═══════════════════════════════════════════════════════════
   CORRECTION PAS À PAS
═══════════════════════════════════════════════════════════ */
function showCorrection(q) {
  const corr = document.getElementById('correctionBlock');

  if (q._forme === 'E') {
    corr.innerHTML = `
      <div class="corr-step">
        <span class="corr-arrow">→</span>
        La bonne décomposition de <strong class="${TC.u}">${q.nombre}</strong> est :
      </div>
      <div class="corr-result">${colorChoiceText(q.choix[q.reponse_index])}</div>
    `;
    corr.classList.add('visible');
    return;
  }

  const parsed   = parseAnswer(q.reponse);
  const COL_NAMES  = { ce:'Centaines', di:'Dizaines', u:'Unités', d:'Dixièmes', c:'Centièmes', m:'Millièmes' };
  const COL_COLORS = { ce:TC.u, di:TC.u, u:TC.u, d:TC.d, c:TC.c, m:TC.m };

  const steps = Object.entries(parsed)
    .filter(([, v]) => v !== '')
    .map(([k, v]) =>
      `<div class="corr-step">
         <span class="corr-arrow">→</span>
         <span class="${COL_COLORS[k]}">${v}</span>
         <span style="color:var(--muted)"> dans la case </span>
         <strong>${COL_NAMES[k]}</strong>
       </div>`
    ).join('');

  corr.innerHTML = `
    ${steps}
    <div class="corr-result">On lit dans le tableau : <span class="${TC.u}">${q.reponse}</span></div>
  `;
  corr.classList.add('visible');
}

/* ═══════════════════════════════════════════════════════════
   FEEDBACK / NAVIGATION
═══════════════════════════════════════════════════════════ */
function showFeedback(type, msg) {
  const cls = type === 'ok' ? 'ok-fb' : type === 'hint' ? 'hint-fb' : 'err-fb';
  const fb  = document.getElementById('feedback');
  fb.className = `feedback visible ${cls}`;
  fb.innerHTML = msg;
}

function showNextBtn() {
  document.getElementById('nextBtn').className = 'next-btn visible';
}

function nextQuestion() {
  sessionIdx++;
  if (sessionIdx >= session.length) { showResultScreen(); return; }
  const card = document.getElementById('qCard');
  card.style.opacity = '0';
  setTimeout(() => { card.style.opacity = ''; renderQuestion(); }, 220);
}

/* ═══════════════════════════════════════════════════════════
   ÉCRAN DE RÉSULTAT
═══════════════════════════════════════════════════════════ */
function showResultScreen() {
  const total     = CONFIG[currentLevel].perSession;
  const threshold = CONFIG[currentLevel].threshold;
  const success   = score >= threshold;

  logResult(currentLevel, score, total);

  if (success) {
    levelsDone[currentLevel] = true;
    sessionStorage.setItem('cdLevelsDone', JSON.stringify(levelsDone));
    initLevelTabs();
  }

  document.getElementById('qCard').style.display        = 'none';
  document.getElementById('progressArea').style.display  = 'none';
  document.getElementById('livePreview').innerHTML       = '';

  const decLabels = ['une décimale','deux décimales','trois décimales'];
  document.getElementById('resultEmoji').textContent = success ? '🎉' : '💪';
  document.getElementById('resultTitle').textContent = success ? 'Niveau réussi !' : 'Presque !';
  document.getElementById('resultScore').textContent = `${score} / ${total}`;
  document.getElementById('resultMsg').textContent   = success
    ? (currentLevel < 3
        ? `Bravo ! Tu sais composer des décimaux à ${decLabels[currentLevel - 1]}.`
        : 'Félicitations ! Tu maîtrises la composition jusqu\'aux millièmes !')
    : `Il faut ${threshold} bonnes réponses sur ${total}. Tu peux le faire !`;

  document.getElementById('nextLevelBtn').style.display =
    (success && currentLevel < 3) ? 'inline-flex' : 'none';

  document.getElementById('resultScreen').classList.add('visible');
  if (success) launchConfetti();
}

function goNextLevel()  { selectLevel(currentLevel + 1); }
function retryLevel()   { document.getElementById('resultScreen').classList.remove('visible'); startLevel(); }

/* ═══════════════════════════════════════════════════════════
   CONFETTIS
═══════════════════════════════════════════════════════════ */
function launchConfetti() {
  const c = document.getElementById('confettiContainer');
  c.innerHTML = '';
  const colors = ['#1A2D6B','#F5A623','#1DBFA0','#E05252','#7C3AED','#fbbf24'];
  for (let i = 0; i < 65; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const sz = 7 + Math.random() * 9;
    el.style.cssText = `
      left:${Math.random()*100}%;background:${colors[i%colors.length]};
      width:${sz}px;height:${sz}px;
      border-radius:${Math.random()>.5?'50%':'2px'};
      animation-duration:${1.4+Math.random()*2.2}s;
      animation-delay:${Math.random()*.9}s;
    `;
    c.appendChild(el);
  }
  setTimeout(() => { c.innerHTML = ''; }, 4500);
}

/* ═══════════════════════════════════════════════════════════
   LOGGING SUPABASE
═══════════════════════════════════════════════════════════ */
function logResult(level, sc, total) {
  // TODO: Supabase logging
  if (typeof saveExerciseResult !== 'function') return;
  saveExerciseResult({
    exerciseSlug: 'composer-decimaux',
    subject:      'mathématiques',
    category:     'nombres-decimaux',
    exerciseType: 'composer',
    level:        String(level),
    score:        sc,
    total
  });
}

/* ═══════════════════════════════════════════════════════════
   DÉMARRAGE
═══════════════════════════════════════════════════════════ */
initLevelTabs();
startLevel();
</script>
